# Configuração do pipeline OCR-06:
#   léxico (IBGE/TSE/RFB) -> fontes -> BRESSAY -> dataset sintético -> mistura final.
# Caminhos relativos à pasta ocr06/.

seed: 42

paths:
  raw: data/raw            # downloads brutos (TSE/RFB são apagados após o processamento)
  lexicon: data/lexicon    # tabelas agregadas (sem nomes completos de pessoas)
  fonts: data/fonts
  synthetic: data/synthetic
  bressay: data/bressay    # linhas do BRESSAY já limpas (labels.jsonl por split)
  final: data/final        # treino/val/teste no formato de conversa do VLM
  experiments: experiments

sources:
  # Prenomes do Censo 2010 (IBGE). A API do IBGE só devolve o top-20 por consulta,
  # então a lista completa vem do espelho do Brasil.IO; o top-20 da API é usado para validar.
  prenomes_url: https://data.brasil.io/dataset/genero-nomes/nomes.csv.gz
  ibge_ranking_url: https://servicodados.ibge.gov.br/api/v2/censos/nomes/ranking
  municipios_url: https://servicodados.ibge.gov.br/api/v1/localidades/municipios
  # Censo 2022, tabela 4709, variável 93 (população residente) por município.
  populacao_url: https://servicodados.ibge.gov.br/api/v3/agregados/4709/periodos/-1/variaveis/93?localidades=N6[all]
  tse:
    url: https://cdn.tse.jus.br/estatistica/sead/odsele/consulta_cand/consulta_cand_{year}.zip
    years: [2024, 2020]
  rfb:
    webdav_url: https://arquivos.receitafederal.gov.br/public.php/webdav/
    share_token: YggdBLfdninEJX9
    month: latest          # ou "AAAA-MM"
    shards: [2, 3]         # Socios{N}.zip; 2..9 têm ~50 MB cada, 0 e 1 ~300 MB
  keep_raw: false          # true mantém os .zip de TSE/RFB em disco

lexicon:
  prenome_min_freq: 20             # o IBGE já suprime nomes com < 20 ocorrências
  prenome_typo_ratio: 1.0e-4       # descarta variante a 1 edição do nome-grupo e com freq/grupo abaixo disso
  sobrenome_min_count: 5           # sobrenomes mais raros que isso são descartados (privacidade + ruído)
  common_mass: 0.80                # "comum" = tokens que somam os primeiros 80% da massa; o resto é "raro"
  invented:
    n_prenomes: 5000
    n_sobrenomes: 5000
    ngram_order: 3
    min_len: 4
    max_len: 12
    plausibility_quantile: 0.20    # log-prob média mínima = quantil 20% dos nomes reais

vocab:
  # Nomes entram por ordem de frequência real até o corte abaixo.
  coverage: auto           # auto = maior lista em que cada nome do treino aparece >= min_expected
                           # vezes (esperado); ou uma fração da população, ex.: 0.95
  min_expected: 2
  heldout_val: 0.05        # fração dos nomes RAROS do vocabulário reservada só p/ validação
  heldout_test: 0.10       # ... só p/ teste (nunca vistos no treino, como pede a proposta)

sampling:
  alpha: 0.5               # temperatura sobre a frequência: q_i ∝ p_i^alpha
  alpha_cidade: 0.5
  p_invented: 0.0          # fração de nomes inventados (sem população); 0 = só nomes reais
  p_upper: 0.30            # linha inteira em caixa alta (comum em formulários)
  templates:
    - {id: nome,          weight: 0.35, pattern: "{nome}"}
    - {id: rotulo_nome,   weight: 0.10, pattern: "Nome: {nome}"}
    - {id: cidade_uf,     weight: 0.10, pattern: "{cidade} - {uf}"}
    - {id: cidade_barra,  weight: 0.05, pattern: "{cidade}/{uf}"}
    - {id: naturalidade,  weight: 0.10, pattern: "natural de {cidade} - {uf}"}
    - {id: nome_natural,  weight: 0.10, pattern: "{nome}, natural de {cidade}"}
    - {id: filho,         weight: 0.10, pattern: "filho de {nome_m} e de {nome_f}"}
    - {id: filha,         weight: 0.10, pattern: "filha de {nome_m} e de {nome_f}"}

fonts:
  font_holdout_frac: 0.2   # fontes exclusivas do teste: mede se o modelo generaliza para letras que não viu
  # Fontes cursivas/caligráficas: nelas a linha nunca sai toda em maiúsculas (ninguém
  # escreve assim e o resultado fica ilegível).
