render:
  font_size: [36, 60]
  word_space: [0.6, 1.6]          # multiplicador da largura do espaço da fonte
  baseline_jitter: 3              # px por palavra
  word_rotation: 2.0              # graus por palavra
  # Estilo de quem escreve (sorteado por linha), como as diferenças entre pessoas:
  slant: [-0.45, 0.25]            # inclinação da letra (cisalhamento; >0 = para a direita)
  width_scale: [0.75, 1.30]       # letra estreita/apertada ou larga/espaçada
  stroke: [-1.0, 2.5]             # traço fino (<0, erode) ou grosso (>0, raio de dilatação em px)
  p_pressure: 0.5                 # espessura variando ao longo da linha (pressão da caneta)
  size_drift: 0.12                # letra cresce ou encolhe do início ao fim da linha
  tilt: 2.0                       # graus: a linha sobe ou desce
  bow: 0.12                       # curvatura da linha (fração do tamanho da fonte)
  # Variação letra a letra: campos suaves ao longo da linha, ~1 nó por letra, então
  # cada letra sai com altura, largura, inclinação e posição um pouco diferentes,
  # sem quebrar as ligaduras das fontes cursivas.
  glyph:
    spacing: 0.55                 # distância entre nós, em tamanhos de fonte
    scale: 0.08                   # altura de cada letra (desvio padrão, fração)
    baseline: 0.05                # subida/descida de cada letra (fração do tamanho)
    slant: 0.08                   # inclinação de cada letra
    width: 0.15                   # largura de cada letra
  tremor_alpha: [0.0, 1.2]        # tremor fino do traço (px)
  tremor_sigma: 2.5
  elastic_alpha: [0.0, 3.0]       # ondulação maior (px)
  elastic_sigma: 6.0
  height: [48, 112]               # altura final da linha em px
  p_lowres: 0.35                  # fração das linhas reduzidas a baixa resolução (BRESSAY ~20 px)
  lowres_height: [16, 30]
  lowres_min_xheight: 7           # px: abaixo disso a minúscula fica ilegível (BRESSAY tem ~7-8)
  min_stroke_to_thin: 5.0         # só afina o traço de fontes com traço >= 5 px
  max_stroke_to_thicken: 8.0      # só engrossa traços <= 8 px (marcador grosso empasta)
  script_min_width: 0.9           # cursivas não são estreitadas abaixo disso
  margin: [4, 24]
  ink_colors:                     # BGR: preto, azul caneta, azul escuro, sépia
    - [20, 20, 20]
    - [140, 50, 20]
    - [90, 30, 10]
    - [40, 60, 90]

degrade:
  # Probabilidade de cada nível; cada nível escala as probabilidades das augmentations.
  levels: {leve: 0.35, medio: 0.45, forte: 0.20}
  scale: {leve: 0.4, medio: 0.8, forte: 1.2}
  min_contrast: 35                # diferença mínima de cinza entre fundo e tinta
  max_retries: 3
  jpeg_quality: 92                # formato de saída

generate:
  name: v0
  n: {train: 40000, val: 2000, test: 4000}
  workers: auto            # auto = nº de CPUs

bressay:
  record: 11637681         # registro no Zenodo (CC-BY 4.0)
  # Marcações das transcrições: @@???@@ ilegível, --xxx-- riscado ilegível,
  # --texto-- riscado legível, ##texto## / $$texto$$ sobrescrito/subscrito.
  drop_illegible: true     # descarta linhas com trecho ilegível
  crossed_out: drop_line   # drop_line | keep_text | remove
  name_stopwords: [Brasil, Deus, Estado, Estados, Governo, Constituição, Federal,
                   República, Internet, Nação, Igreja, Ministério, Senado, Congresso,
                   Lei, Leis, Nova, Novo, Norte, Sul, Leste, Oeste, União, Artes, Grade,
                   Guerra, Mundial, Saúde, Primeira, Segunda, Terceira, Sétima, Máxima,
                   Urbana, Nacional, Educação, Cultura, Justiça, Ciência, Ciências,
                   América, Carta, Magna, Coringa]

mix:
  max_real_fraction: 0.45  # BRESSAY < 45% do treino (a POC exige predominância sintética)
  format: misto            # chandra = prompt e saída nativos; nosso = prompt curto; misto = metade de cada (ver mix.py)
  chandra_fraction: 0.5

experiment1:
  alphas: [0.3, 0.5, 1.0]
  budgets: [10000, 40000, 100000]  # tamanhos de treino para a tabela de vocabulário
  n_draws: 200000                 # sorteios de token por alpha (sem renderizar)
  n_images: 1000                  # imagens para tempo/tamanho/inspeção
  contact_sheet: 40

# ----------------------------------------------------------------- modelo (servidor)
model:
  base: datalab-to/chandra-ocr-2                   # BF16, usado no treino (fine-tune do Qwen3.5-4B)
  base_fp8: dangvansam/chandra-ocr-2-FP8-dynamic   # FP8 de terceiros, só p/ baseline no vLLM
  dataset: v1                                      # data/final/<dataset>/ (v1 = mix misto)
  run: lora_v0                                     # models/<run>/{adapter,merged,merged-fp8}
  # Prompt nativo do Chandra para páginas (ocr_layout, o que o CLI do Chandra usa), no treino
  # e na avaliação. prompt_chandra_ocr.txt é a variante sem layout.
  chandra_prompt_file: configs/prompt_chandra_layout.txt

  vllm:
    max_model_len: 4096
    gpu_memory_utilization: 0.85
    max_num_seqs: 128
    max_tokens: 192                # linhas são curtas; corta respostas que desandam
    # Mesmos limites no treino (train.py) e na inferência. São os padrões do processador
    # do Chandra: linha curta é ampliada até 65.536 px (com 3136 uma linha de nome virava
    # 36 tokens no vLLM e 75 no treino, ou seja, o modelo era testado em outra escala).
    min_pixels: 65536
    max_pixels: 16777216

  # Teste de página inteira (src/ocr06/pages.py): páginas A4 reduzidas para 2048 px de
  # altura viram ~3 mil tokens de imagem, e a resposta de um formulário passa de 2 mil.
  vllm_pages:
    max_model_len: 12288
    max_tokens: 6144
    max_num_seqs: 16

  lora:
    r: 16
    alpha: 32
    dropout: 0.05
    # Camadas lineares do modelo de linguagem que recebem LoRA (o encoder de visão fica
    # congelado). Nomes não encontrados no modelo são ignorados com aviso.
    target: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj,
             in_proj_qkvz, in_proj_ba, in_proj_qkv, in_proj_z, in_proj_b, in_proj_a, out_proj]

  train:
    epochs: 1                      # 1 época (~2,8 h na G4); a parada antecipada pode encerrar antes
    lr: 1.0e-4                     # o Chandra já lê manuscrito; ajuste mais suave
    batch_size: 16                 # por GPU (G4 96 GB; numa L4 de 24 GB use 4 x grad_accum 4)
    grad_accum: 1                  # lote efetivo = 16
    warmup_ratio: 0.03
    eval_steps: 300
    # Validação separada por fonte. O melhor checkpoint e a parada antecipada usam só a
    # loss do BRESSAY (manuscrito real): se o modelo decorar as fontes sintéticas, a loss
    # sintética continua caindo e esconderia isso.
    max_val: {sintetico: 400, bressay: 800}
    best_metric: eval_bressay_loss
    early_stopping_patience: 3     # avaliações sem melhora na loss do BRESSAY
    dataloader_workers: 12
    pilot_steps: 100               # scripts/run.sh piloto
    # Páginas inteiras (exemplos com `spans`/`w_default`, ver train.py); as linhas não mudam.
    page_max_side: 2048            # lado maior da página no treino; o mesmo de model/pages_infer.py
    curriculum: false              # true = ordem por `level` crescente (pensado para 1 época);
                                   # exemplos sem `level` (linhas) intercalados ao longo do treino

  quant:
    # Mesma receita do chandra-ocr-2-FP8-dynamic (llm-compressor), p/ comparação justa.
    scheme: FP8_DYNAMIC
    ignore: ['re:.*lm_head', 're:visual.*', 're:model.visual.*', 're:.*mlp.gate$',
             're:.*embed_tokens$', 're:.*shared_expert_gate$', 're:.*mlp\.shared_expert$',
             're:.*linear_attn.*']

# Normalização de altura antes do modelo (treino e inferência, ver src/ocr06/preprocess.py).
# BRESSAY tem mediana de 20 px e o sintético 48-112 px; 64 px = 2 blocos visuais do Chandra.
# A altura final ainda deve ser confirmada no baseline (BRESSAY com 32, 64 e 96 px).
preprocess:
  line_height: 64                  # null desliga
  max_width: 2048                  # linhas mais longas são reduzidas junto

# Controles na saída do modelo (src/ocr06/guard.py). Não bloqueiam: marcam para revisão.
guard:
  # limite de caracteres = k x largura / altura. k calibrado no treino+validação
  # (p99,9 = 8,3; máximo da validação = 9,8). Com 4,0 cortava 28% dos gabaritos de teste.
  chars_per_height: 10.0
  min_chars: 16
  max_bad_chars: 0                 # caracteres fora do conjunto esperado
  min_word_conf: 0.5               # palavra abaixo disso vai para revisão
  logprobs: 1                      # pede ao vLLM a log-prob do token gerado
