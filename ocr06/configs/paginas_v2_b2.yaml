# Igual ao paginas_v2.yaml, com lotes de 2 páginas e acumulação de 8 (mesmo lote efetivo), para GPUs menores.
seed: 42
paths:
  raw: data/raw
  lexicon: data/lexicon
  fonts: data/fonts
  synthetic: data/synthetic
  bressay: data/bressay
  final: data/final
  experiments: experiments
sources:
  prenomes_url: https://data.brasil.io/dataset/genero-nomes/nomes.csv.gz
  ibge_ranking_url: https://servicodados.ibge.gov.br/api/v2/censos/nomes/ranking
  municipios_url: https://servicodados.ibge.gov.br/api/v1/localidades/municipios
  populacao_url: https://servicodados.ibge.gov.br/api/v3/agregados/4709/periodos/-1/variaveis/93?localidades=N6[all]
  tse:
    url: https://cdn.tse.jus.br/estatistica/sead/odsele/consulta_cand/consulta_cand_{year}.zip
    years:
    - 2024
    - 2020
  rfb:
    webdav_url: https://arquivos.receitafederal.gov.br/public.php/webdav/
    share_token: YggdBLfdninEJX9
    month: latest
    shards:
    - 2
    - 3
  keep_raw: false
lexicon:
  prenome_min_freq: 20
  prenome_typo_ratio: 0.0001
  sobrenome_min_count: 5
  common_mass: 0.8
  invented:
    n_prenomes: 5000
    n_sobrenomes: 5000
    ngram_order: 3
    min_len: 4
    max_len: 12
    plausibility_quantile: 0.2
vocab:
  coverage: auto
  min_expected: 2
  heldout_val: 0.05
  heldout_test: 0.1
sampling:
  alpha: 0.5
  alpha_cidade: 0.5
  p_invented: 0.0
  p_upper: 0.3
  templates:
  - id: nome
    weight: 0.35
    pattern: '{nome}'
  - id: rotulo_nome
    weight: 0.1
    pattern: 'Nome: {nome}'
  - id: cidade_uf
    weight: 0.1
    pattern: '{cidade} - {uf}'
  - id: cidade_barra
    weight: 0.05
    pattern: '{cidade}/{uf}'
  - id: naturalidade
    weight: 0.1
    pattern: natural de {cidade} - {uf}
  - id: nome_natural
    weight: 0.1
    pattern: '{nome}, natural de {cidade}'
  - id: filho
    weight: 0.1
    pattern: filho de {nome_m} e de {nome_f}
  - id: filha
    weight: 0.1
    pattern: filha de {nome_m} e de {nome_f}
