  - Coringa
mix:
  max_real_fraction: 0.45
  format: misto
  chandra_fraction: 0.5
experiment1:
  alphas:
  - 0.3
  - 0.5
  - 1.0
  budgets:
  - 10000
  - 40000
  - 100000
  n_draws: 200000
  n_images: 1000
  contact_sheet: 40
model:
  base: datalab-to/chandra-ocr-2
  base_fp8: dangvansam/chandra-ocr-2-FP8-dynamic
  dataset: pages_v2
  run: lora_v2
  chandra_prompt_file: configs/prompt_chandra_layout.txt
  vllm:
    max_model_len: 4096
    gpu_memory_utilization: 0.85
    max_num_seqs: 128
    max_tokens: 192
    min_pixels: 65536
    max_pixels: 16777216
  vllm_pages:
    max_model_len: 12288
    max_tokens: 6144
    max_num_seqs: 48
  lora:
    r: 16
    alpha: 32
    dropout: 0.05
    target:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
    - in_proj_qkvz
    - in_proj_ba
    - in_proj_qkv
    - in_proj_z
    - in_proj_b
    - in_proj_a
    - out_proj
  train:
    epochs: 1
    lr: 0.0001
    batch_size: 2
    grad_accum: 8
    warmup_ratio: 0.03
    eval_steps: 25
    max_val:
      local: 20
      ocrsd: 20
    best_metric: eval_local_loss
    early_stopping_patience: 1000
    dataloader_workers: 8
    pilot_steps: 5
    page_max_side: 2048
    curriculum: true
    lr_scheduler: constant_with_warmup
    init_adapter: models/lora_v1/adapter
    name_boost: 2.0
  quant:
    scheme: FP8_DYNAMIC
    ignore:
    - re:.*lm_head
    - re:visual.*
    - re:model.visual.*
    - re:.*mlp.gate$
    - re:.*embed_tokens$
    - re:.*shared_expert_gate$
    - re:.*mlp\.shared_expert$
    - re:.*linear_attn.*
preprocess:
  line_height: 64
  max_width: 2048
guard:
  chars_per_height: 10.0
  min_chars: 16
  max_bad_chars: 0
  min_word_conf: 0.5
  logprobs: 1
